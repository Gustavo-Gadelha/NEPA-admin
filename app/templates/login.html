<!DOCTYPE html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6">Painel Administrativo</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-4 space-y-2">
        {% for category, message in messages %}
        <div class="
            p-3 rounded text-sm
            {% if category == 'error' %}
              bg-red-100 text-red-700
            {% elif category == 'success' %}
              bg-green-100 text-green-700
            {% else %}
              bg-gray-100 text-gray-700
            {% endif %}
          ">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      <form class="space-y-4" method="POST">

        <input name="csrf_token" type="hidden" value="{{ csrf_token() }}">

        <div>
          <label class="block text-sm font-medium text-gray-700" for="email">Email</label>
          <input
              class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              id="email"
              name="email"
              required
              type="email"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700" for="senha">Senha</label>
          <input
              class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              id="senha"
              name="password"
              required
              type="password"
          >
        </div>

        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition" type="submit">
          Entrar
        </button>
      </form>
    </div>
  </body>
</html>
